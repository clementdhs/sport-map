# Dependency updates. Security fixes are enabled in the repository settings; the cooldown and pull request
# limit below only apply to version updates, and each group says which kind of update it gathers.
# The Android project (android/) is left out: Capacitor pins its Gradle versions and its upgrades go
# through `npx cap migrate`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    # A release must be a week old before it is proposed: compromised npm releases are usually pulled within days.
    cooldown:
      default-days: 7
    # Minor and patch updates come as one pull request a week.
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
      # Security fixes come as one pull request too, instead of one per package (each one a full CI run).
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    # Major versions (Nuxt, Nuxt UI, MapLibre, Supabase…) change their APIs: each one gets its own issue,
    # upgraded by hand.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 3
    labels: [infra]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    labels: [infra]
