name: CI

# Every branch: a pushed feature branch gets its result before being merged into main.
# A push that only touches documentation or Claude's files runs nothing. If CI ever becomes a required
# check for merging, a workflow skipped this way leaves the pull request waiting: filter in the jobs instead.
# The weekly run and the manual one test main in full, end-to-end tests included (see the e2e job).
on:
  push:
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:

# A newer push on the same branch makes the running check pointless. The event is part of the group so
# that a push to main doesn't cancel the weekly run, the only one testing main end to end.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Two jobs in parallel: the end-to-end tests don't wait for the lint, types and unit tests.
jobs:
  checks:
    name: Lint, types et tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The ESLint config extends .nuxt/eslint.config.mjs, written by npm ci's postinstall (nuxt prepare).
      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests unitaires et du store
        run: npm test

  # Not on a push to main: the squashed pull request already passed them on its branch, and running them
  # twice used most of the Actions minutes. Two pull requests merged one after the other without being
  # tested together are caught by the weekly run, or sooner by a manual run.
  e2e:
    name: Tests de bout en bout
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Docker is available on GitHub-hosted Ubuntu runners. No secret needed: the e2e tests only use this
      # local Supabase and mock the map and routing services.
      - name: Supabase local
        run: npm run db:start

      - name: Cache des navigateurs Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: npm run test:e2e

      - name: Traces Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
