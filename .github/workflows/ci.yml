name: CI

# Every branch: a pushed feature branch gets its result before being merged into main.
# Every push runs, documentation-only ones included: the "Protect main" ruleset requires the checks job,
# and a workflow skipped by a path filter would leave the pull request waiting forever (#332).
# A push to main tests it in full, end-to-end tests included; the weekly run catches what changed outside
# the repository (dependencies resolved at install, external services).
on:
  push:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:

# A newer push on the same branch makes the running check pointless. The event is part of the group so
# that a push to main doesn't cancel the weekly run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Two jobs in parallel: the end-to-end tests don't wait for the lint, types and unit tests.
jobs:
  checks:
    name: Lint, types et tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The ESLint config extends .nuxt/eslint.config.mjs, written by npm ci's postinstall (nuxt prepare).
      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests unitaires et du store
        run: npm test

  # On main too: two pull requests merged one after the other were each tested alone on their branch.
  # The repository is public, so Actions minutes are unlimited (#332).
  e2e:
    name: Tests de bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Docker is available on GitHub-hosted Ubuntu runners. No secret needed: the e2e tests only use this
      # local Supabase and mock the map and routing services.
      - name: Supabase local
        run: npm run db:start

      - name: Cache des navigateurs Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: npm run test:e2e

      - name: Traces Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
